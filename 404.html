<!DOCTYPE html> 
<html>
<head>
  <meta charset="utf-8">
  <title>AniDB Static API</title>
  <script>
    // SPA Router: Convert path /21/1 to hash /#/21/1 cleanly without loops
    var l = window.location;
    var cleanPath = l.pathname.replace(/^\/andbgithub\/?/i, '').replace(/^\/+|\/+$/g, '');
    if (cleanPath && !cleanPath.includes('.')) {
      var baseDir = l.pathname.replace(new RegExp(cleanPath + '$'), '');
      l.replace(l.protocol + '//' + l.host + baseDir + '#/' + cleanPath + l.search);
    }
  </script>
</head>
<body>
</body>
</html>
