<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AniDB GitHub Static API</title>
  <style>
    body {
      background: #0d1117;
      color: #e6edf3;
      font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace;
      margin: 0;
      padding: 16px;
      line-height: 1.4;
    }
    pre {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <pre id="jsonOutput">Loading AniDB API response...</pre>

  <script type="module">
    import { getEpisodes, handleWatch } from './anidb-client.js';

    function parseParams() {
      const l = window.location;
      
      let rawRoute = "";
      if (l.search && l.search.startsWith('?/')) {
        rawRoute = l.search.slice(2).replace(/~and~/g, '&');
      } else if (l.hash && l.hash.length > 1) {
        rawRoute = l.hash.replace(/^#\/?/, '');
      } else {
        let cleanPath = l.pathname.replace(/^\/andbgithub\/?/i, '').replace(/^\/+|\/+$/g, '');
        if (cleanPath && !cleanPath.endsWith('.html')) {
          rawRoute = cleanPath;
        }
      }

      const urlParams = new URLSearchParams(l.search);
      const parts = rawRoute.split('?')[0].split('/').filter(Boolean);

      let anilistId = urlParams.get('id') || parts[0];
      let epNum = urlParams.get('ep') || urlParams.get('episode');
      let audio = urlParams.get('audio') || 'both';

      if (!epNum && parts.length >= 2) {
        if (parts.length === 2) {
          epNum = parts[1];
        } else if (parts.length >= 3) {
          audio = parts[1];
          epNum = parts[2];
        }
      }

      return { anilistId, epNum, audio };
    }

    async function handleApiRequest() {
      const output = document.getElementById('jsonOutput');
      const { anilistId, epNum, audio } = parseParams();

      if (!anilistId) {
        output.textContent = JSON.stringify({
          status: "online",
          service: "AniDB GitHub Static API",
          routes: {
            episodes: "github.io/andbgithub/21  (or /#/21 or ?id=21)",
            watchBoth: "github.io/andbgithub/21/1  (or /#/21/1 or ?id=21&ep=1)",
            watchSub: "github.io/andbgithub/21/sub/1  (or /#/21/sub/1)",
            watchDub: "github.io/andbgithub/21/dub/1  (or /#/21/dub/1)"
          },
          examples: [
            "https://YOUR_USER.github.io/andbgithub/21",
            "https://YOUR_USER.github.io/andbgithub/21/1",
            "https://YOUR_USER.github.io/andbgithub/#/21/1",
            "https://YOUR_USER.github.io/andbgithub/?id=21&ep=1"
          ]
        }, null, 2);
        return;
      }

      try {
        if (epNum) {
          const watchData = await handleWatch(anilistId, audio, epNum);
          output.textContent = JSON.stringify(watchData, null, 2);
        } else {
          const epData = await getEpisodes(anilistId);
          output.textContent = JSON.stringify(epData, null, 2);
        }
      } catch (err) {
        document.title = "404 Not Found";
        output.textContent = JSON.stringify({
          error: err.message || "Request failed",
          status: 404
        }, null, 2);
      }
    }

    handleApiRequest();
  </script>
</body>
</html>
